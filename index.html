<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyseur de Plantes - Gemini</title>
    <!-- Tailwind CSS (CDN) pour un design moderne -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- En-tête -->
    <header class="w-full max-w-md text-center py-4">
        <h1 class="text-2xl font-bold tracking-tight text-emerald-400">🌿 PlantScan AI</h1>
        <p class="text-xs text-slate-400 mt-1">Identifiez l'espèce, la santé et la consigne de votre plante</p>
    </header>

    <!-- Contenu Principal -->
    <main class="w-full max-w-md flex flex-col gap-3 my-auto">

        <!-- Clé API Gemini -->
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl shadow-lg">
            <label for="apiKey" class="block text-xs font-medium text-slate-300 mb-1">Clé API Gemini :</label>
            <input type="password" id="apiKey" placeholder="Entrez votre clé API Google AI Studio" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Sélection du Modèle Gemini -->
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl shadow-lg">
            <label for="modelSelect" class="block text-xs font-medium text-slate-300 mb-1">Modèle Gemini :</label>
            <select id="modelSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                <option value="gemini-3.8-flash" selected>Gemini 3.8 Flash (Défaut recommandé)</option>
                <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (Ultra rapide)</option>
                <option value="gemini-3-flash-preview">Gemini 3 Flash</option>
            </select>
        </div>

        <!-- Zone Caméra / Aperçu -->
        <div class="relative w-full aspect-[3/4] bg-slate-900 border-2 border-dashed border-slate-800 rounded-2xl overflow-hidden flex flex-col items-center justify-center shadow-2xl">
            <video id="video" autoplay playsinline class="absolute inset-0 w-full h-full object-cover hidden"></video>
            <canvas id="canvas" class="hidden"></canvas>
            <img id="preview" class="absolute inset-0 w-full h-full object-cover hidden" alt="Aperçu">

            <div id="placeholder" class="flex flex-col items-center p-6 text-center">
                <svg class="w-12 h-12 text-slate-600 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <p class="text-sm text-slate-400">Prenez une photo ou importez une image de la plante</p>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-2">
            <button id="snapBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm">
                📸 Prendre une photo
            </button>
            <label class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm cursor-pointer">
                📁 Importer
                <input type="file" id="fileInput" accept="image/*" class="hidden">
            </label>
        </div>

        <!-- Bouton Analyser -->
        <button id="analyzeBtn" disabled class="w-full bg-slate-800 text-slate-500 font-semibold py-3 px-4 rounded-xl shadow transition flex items-center justify-center gap-2 text-sm cursor-not-allowed">
            ✨ Analyser avec Gemini
        </button>

        <!-- Résultats -->
        <div id="resultCard" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
            <h2 class="text-sm font-bold text-emerald-400 uppercase tracking-wider">Résultat de l'analyse</h2>

            <!-- Phrase de résumé -->
            <p id="resSummary" class="text-sm text-slate-200 leading-relaxed bg-slate-950 p-3 rounded-xl border border-slate-800">-</p>

            <!-- Consigne -->
            <div class="bg-emerald-950/40 border border-emerald-800/50 p-3 rounded-xl">
                <span class="block text-xs font-semibold text-emerald-400 uppercase mb-1">Consigne</span>
                <p id="resInstruction" class="text-sm text-emerald-200">-</p>
            </div>
        </div>

        <!-- Chargement -->
        <div id="loader" class="hidden flex flex-col items-center justify-center py-4 gap-2">
            <div class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-xs text-slate-400">Gemini analyse votre plante...</p>
        </div>

    </main>

    <!-- Pied de page -->
    <footer class="w-full max-w-md text-center py-2 text-xs text-slate-600">
        Propulsé par Google Gemini API
    </footer>

    <!-- Script JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
